name: verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: build-article --check --all
        run: python3 scripts/build-article.py --check --all

      - name: verify:code-blocks --strict
        run: node scripts/verify-code-blocks.mjs --strict

      - name: verify:links
        run: pnpm verify:links

      - name: verify:legacy
        run: pnpm verify:legacy

      - name: demo build
        run: pnpm --filter next-lab build

      - name: demo test
        run: pnpm --filter next-lab test
